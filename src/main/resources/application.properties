spring.application.name=helpdesk-notification-service
server.port=8082

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/helpdesk_db}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:rootpassword}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=${DATABASE_SCHEMA:notification_schema}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

notification.rabbitmq.exchange=${RABBITMQ_EXCHANGE:helpdesk.events}
notification.rabbitmq.queue=${RABBITMQ_QUEUE:notification-service.queue}
notification.rabbitmq.routing-key=${RABBITMQ_ROUTING_KEY:ticket.#}
notification.rabbitmq.ticket-created-routing-key=${RABBITMQ_TICKET_CREATED_ROUTING_KEY:ticket.created}
notification.rabbitmq.ticket-assigned-routing-key=${RABBITMQ_TICKET_ASSIGNED_ROUTING_KEY:ticket.assigned}
notification.rabbitmq.ticket-status-changed-routing-key=${RABBITMQ_TICKET_STATUS_CHANGED_ROUTING_KEY:ticket.status.changed}